services:
  - type: web
    name: plantation-stay
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: plantation-stay-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: HOLD_MINUTES
        value: "10"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.7"

databases:
  - name: plantation-stay-db
    plan: free
