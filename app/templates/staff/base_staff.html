<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Staff Administration — {{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <style>
    .staff-header {
      background: var(--color-ink);
      color: var(--color-paper);
      padding: var(--space-3) 0;
      border-bottom: 2px solid var(--color-accent);
    }
    .staff-header a {
      color: var(--color-paper);
    }
    .staff-nav {
      display: flex;
      gap: var(--space-4);
      align-items: center;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .staff-nav a.active {
      color: #E6A15C;
      font-style: italic;
    }
    .staff-badge {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.15);
    }
    .ledger-table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      margin-top: var(--space-4);
    }
    .ledger-table th, .ledger-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--color-border);
      font-size: 0.92rem;
    }
    .ledger-table th {
      font-weight: 600;
      background: #EFE9DC;
      letter-spacing: 0.05em;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.75rem;
      border-radius: var(--radius-sm);
      font-weight: 500;
      text-transform: uppercase;
    }
    .badge-held { background: #EAE3D2; color: #5B4E44; }
    .badge-confirmed { background: #D4EDDA; color: #155724; }
    .badge-refund { background: #F8D7DA; color: #721C24; font-weight: bold; }
    .badge-refunded { background: #E2E3E5; color: #383D41; }
    .badge-blackout { background: #FCE8E6; color: #A63A2B; font-weight: 600; }
    .alert-banner {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-4);
      font-size: 0.92rem;
    }
    .alert-error {
      background: #F8D7DA;
      color: #721C24;
      border: 1px solid #F5C6CB;
    }
    .alert-success {
      background: #D4EDDA;
      color: #155724;
      border: 1px solid #C3E6CB;
    }
    .alert-warning {
      background: #FFF3CD;
      color: #856404;
      border: 1px solid #FFEEBA;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="staff-header">
    <div class="container header-inner" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-3);">
      <div style="display: flex; align-items: baseline; gap: var(--space-3);">
        <a href="/staff/calendar" style="font-size: 1.25rem; font-weight: 600; text-decoration: none;">Plantation Stay Staff</a>
        {% if current_user %}
        <span class="staff-badge">{{ current_user.role }}</span>
        {% endif %}
      </div>

      {% if current_user %}
      <nav>
        <ul class="staff-nav">
          <li><a href="/staff/calendar" class="{% if active_tab == 'calendar' %}active{% endif %}">Tariff & Allotment</a></li>
          <li><a href="/staff/promos" class="{% if active_tab == 'promos' %}active{% endif %}">Promotions</a></li>
          <li><a href="/staff/bookings" class="{% if active_tab == 'bookings' %}active{% endif %}">Bookings & Refunds</a></li>
          <li>
            <form action="/staff/logout" method="post" style="display: inline; margin: 0;">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button type="submit" style="background: none; border: none; color: #DCE1DF; cursor: pointer; text-decoration: underline; font-family: inherit; font-size: 0.9rem; padding: 0;">Logout ({{ current_user.full_name }})</button>
            </form>
          </li>
        </ul>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="main-content" style="padding: var(--space-6) 0 var(--space-8);">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
